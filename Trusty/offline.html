<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TrustMate — No Connection</title>
<style>
  :root { --gm: #1a5c28; --cream: #faf9f5; --muted: #6b6b60; --border: #e8e5df; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: DM Sans, system-ui, sans-serif;
    background: var(--cream);
    color: #1a1a18;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align: center;
    min-height: 100dvh;
  }
  .icon {
    width: 80px; height: 80px;
    background: var(--gm);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
    font-size: 36px;
  }
  h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
  p { font-size: 15px; color: var(--muted); line-height: 1.6; max-width: 320px; margin-bottom: 28px; }
  button {
    background: var(--gm); color: #fff;
    border: none; border-radius: 8px;
    padding: 13px 32px; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  button:active { opacity: .85; }
  .logo { font-size: 13px; color: var(--muted); margin-top: 40px; font-weight: 600; letter-spacing: .3px; }
</style>
</head>
<body>
  <div class="icon">✓</div>
  <h1>You're offline</h1>
  <p>Check your internet connection and try again. Your TrustMate data will load as soon as you're back online.</p>
  <button onclick="window.location.reload()">Try Again</button>
  <div class="logo">TrustMate Fleet</div>
</body>
</html>
